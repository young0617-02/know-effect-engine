[project]
name = "know-effect-engine"
version = "0.1.0"
description = "知效引擎（KEE）· 数字技术服务企业交付知识服务引擎 —— 当前推进 Gate 0 可行性验证"
requires-python = ">=3.12,<3.13"

# 说明：torch / transformers 等大件不在这里声明，由本机 D:\py312-torch 的 CUDA 环境
# 通过 scripts/bootstrap_env.py 写入的 .pth 挂载提供（避免重复下载 GB 级轮子）。
dependencies = [
    "pymilvus==3.0.2",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "numpy==2.5.3",
    "jieba==0.42.1",
    "PyYAML>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    # 文档解析的本地 MinerU-ONNX 后端：CPU 推理，模型用本机既有权重
    "onnxruntime>=1.19",
    "pypdfium2>=4.30",
    "pillow>=10.3",
    # 在线链路编排（方案 6.3 类型化状态机）与多轮 Checkpointer。
    # 装前做过冲突 spike：解析结果 21 + 2 个包全是「新增」，无升级无卸载，
    # pydantic/fastapi/starlette/anyio/torch/numpy/httpx 版本一字未动，
    # 装完 CUDA 仍 available、84 项单测仍绿（见 reports/m3 的 spike 记录）。
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    # 可观测层（`src/kee/obs/`）。只引这一个包：Prometheus 文本格式由它生成，
    # Langfuse 上报走官方 ingestion 批量接口（httpx + Basic），**刻意不装 `langfuse` SDK**——
    # SDK v3 拖进 OpenTelemetry 一整套 exporter/protobuf，为一个默认关闭的功能不值，
    # 且每个依赖都要过 `scripts/m5_version_lock.py` 的「声明≠用到」闸门。
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kee"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
