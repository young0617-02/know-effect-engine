# M4 一键 Demo：在 Gate 0 存储栈之上加一个 web 容器。
#
# 跑法（仓库根目录）：
#   uv run python scripts/serve_api.py &        # 宿主起 API（见下方「为什么 API 不在这里」）
#   cd frontend && npm run build                # 产出 frontend/dist
#   docker compose -f infra/docker-compose.m4.yml up -d
#   浏览器打开 http://127.0.0.1:38080/
#
# **为什么 API 容器不在本文件里**：pyproject 刻意不声明 torch / transformers——
# 它们由本机 `D:\py312-torch` 的 CUDA 环境经 .pth 挂载提供（见 pyproject 第 7 行注释），
# 嵌入/重排跑在宿主 8GB 显存上。把它装进容器要么拉 GB 级轮子（违反本机「不重复下载大件」的约束），
# 要么在容器里再要一份 CUDA 运行时。所以这一版 Demo 的形态是：
#   存储 + 前端 = 容器；API = 宿主进程；Nginx 经 host-gateway 反代宿主 API。
# 这是对方案「应用与 Nginx 容器化」的**部分偏离**，已登记为待裁决，不是默认通过。
#
# 端口一律只绑 127.0.0.1 且落在 3xxxx 段（本机 5xxx/8xxx 段被其他服务占用）。

# 必须与 docker-compose.gate0.yml 的 `name` 一致：`include` 只并配置，**不并项目名**。
# 少了这一行，web 会落进默认项目（目录名 infra），于是 `up -d` 想再建一套 etcd/minio/milvus，
# 撞上已在跑的 kee-* 容器名直接报 Conflict —— 「一键」当场变成「一坏」。
name: kee-gate0

include:
  - docker-compose.gate0.yml

services:
  kee-web:
    image: nginx:1.27-alpine
    container_name: kee-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:38080:80"
    volumes:
      # 挂 dist 而不是 build 镜像：Demo 要能「改完前端重新 build 就生效」，
      # 每次改前端都重新构建镜像会让验证节奏慢到没人愿意验证。
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.m4.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      # Docker Desktop 上 host.docker.internal 自带；host-gateway 写给 Linux 引擎兜底
      - "host.docker.internal:host-gateway"
    networks:
      - kee-net
