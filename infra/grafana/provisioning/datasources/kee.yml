apiVersion: 1

datasources:
  - name: kee-prometheus
    uid: kee
    type: prometheus
    access: proxy
    # 走 host.docker.internal 而不是 compose 服务名：这台机器的 compose 网络有过
    # 「服务名 DNS 别名不生效」的记录，而这条通路（nginx 反代宿主 API）是今天实测通过的那条。
    # 看板里所有面板都引用这个 uid，换地址只改这一行。
    url: http://host.docker.internal:39090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
